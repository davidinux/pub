<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540">
  <rect width="900" height="540" fill="white"/>
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6715E8">Cost vs performance</text>

  <g stroke="#d9d9d9" stroke-width="1">
    <line x1="105" y1="95" x2="105" y2="455"/>
    <line x1="105" y1="455" x2="820" y2="455"/>
    <line x1="105" y1="365" x2="820" y2="365"/>
    <line x1="105" y1="275" x2="820" y2="275"/>
    <line x1="105" y1="185" x2="820" y2="185"/>
    <line x1="105" y1="95" x2="820" y2="95"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#444">
    <text x="105" y="485" text-anchor="middle">$0</text>
    <text x="283" y="485" text-anchor="middle">$2</text>
    <text x="462" y="485" text-anchor="middle">$4</text>
    <text x="640" y="485" text-anchor="middle">$6</text>
    <text x="820" y="485" text-anchor="middle">$8+</text>
    <text x="88" y="460" text-anchor="end">Low</text>
    <text x="88" y="280" text-anchor="end">Medium</text>
    <text x="88" y="100" text-anchor="end">High</text>
    <text x="465" y="525" text-anchor="middle" font-weight="700">Cost per task (USD, API reference)</text>
    <text x="20" y="275" text-anchor="middle" transform="rotate(-90 20 275)" font-weight="700">Performance / intelligence</text>
  </g>

  <line x1="105" y1="455" x2="820" y2="455" stroke="#333" stroke-width="2"/>
  <line x1="105" y1="95" x2="105" y2="455" stroke="#333" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <circle cx="730" cy="105" r="9" fill="#6715E8"/>
    <text x="745" y="110" fill="#333">Claude Opus 5.5</text>
    <circle cx="218" cy="135" r="9" fill="#6715E8"/>
    <text x="233" y="140" fill="#333">GPT-6.1 Sol</text>

    <circle cx="434" cy="215" r="9" fill="#0088a8"/>
    <text x="449" y="220" fill="#333">Kimi K3.1 Pro</text>
    <circle cx="158" cy="300" r="9" fill="#0088a8"/>
    <text x="173" y="305" fill="#333">DeepSeek V4.1 Flash</text>
    <circle cx="550" cy="315" r="9" fill="#0088a8"/>
    <text x="565" y="320" fill="#333">GLM-5.3</text>
    <circle cx="420" cy="400" r="9" fill="#0088a8"/>
    <text x="435" y="405" fill="#333">Qwen3.8 27B</text>

    <circle cx="145" cy="430" r="9" fill="#2e7d32"/>
    <text x="160" y="435" fill="#333">OLMo 3*</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13">
    <circle cx="220" cy="60" r="7" fill="#6715E8"/>
    <text x="235" y="65" fill="#333">Closed</text>
    <circle cx="315" cy="60" r="7" fill="#0088a8"/>
    <text x="330" y="65" fill="#333">Open-weight</text>
    <circle cx="455" cy="60" r="7" fill="#2e7d32"/>
    <text x="470" y="65" fill="#333">Truly open source</text>
  </g>

  <text x="105" y="515" font-family="Arial, sans-serif" font-size="11" fill="#666">* OLMo 3: true-open reference; no directly comparable API cost/index point.</text>
</svg>
