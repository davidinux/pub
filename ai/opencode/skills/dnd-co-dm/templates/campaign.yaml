# Campaign metadata file
# Copy this template to ../campaigns/<campaign-name>/campaign.yaml

name: my-campaign
title: "My Campaign Title"
edition: "2024"          # "2014" or "2024"
setting: "Forgotten Realms"
tone: "Heroic fantasy"   # gothic horror, grimdark, heroic fantasy, sword & sorcery, etc.
starting_level: 3

# Optional overrides
rules_variants: []
#  - "Heroic inspiration at start of each session"
#  - "Flanking gives +2 instead of advantage"

house_rules: []
#  - "Nat 20 on skill checks auto-succeeds"
#  - "Potions: bonus action to drink, action to feed"
#  - "Critical hits: max damage + roll"

# After uploading an adventure PDF, the AI extracts these files:
#   source/       — original PDF (saved on import)
#   locations.yaml  — every area/room/location
#   npcs.yaml       — every NPC with personality, stats, secrets
#   encounters.yaml — every encounter with creatures and tactics
#   lore.yaml       — plot hooks, backstory, faction info
#
# See templates/extracted/ for the expected format.
